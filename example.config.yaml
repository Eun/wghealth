# WireGuard Health Check Configuration

# Path to WireGuard configuration file (standard .conf format)
wireguard_config_path: "example.wireguard.conf"

# Ping test configuration
ping:
  target: "8.8.8.8"  # IP or hostname to ping
  timeout: 10  # Timeout in seconds (default: 10)
  count: 4  # Number of pings (default: 1)